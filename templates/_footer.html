<footer class="site-footer" id="links">
  <h2 class="hand">また、のぞきにきてね。</h2>
  <ul class="social-links">
    {% for social in social_links %}
    <li>{% if social.url %}<a href="{{ social.url }}" target="_blank" rel="noopener noreferrer">{{ social.name }} ↗<span class="sr-only">（新しいタブ）</span></a>{% else %}<span>{{ social.name }}（準備中）</span>{% endif %}</li>
    {% endfor %}
  </ul>
  <div class="footer-bottom"><small>© 2026 {{ profile.name }}</small><a href="#top">ページの上へ ↑</a></div>
</footer>
